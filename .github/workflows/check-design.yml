name: Storefront checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/check-design.py
      - run: node --check assets/storefront-shader.js
